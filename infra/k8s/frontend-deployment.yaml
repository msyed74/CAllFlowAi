apiVersion: apps/v1
kind: Deployment
metadata:
  name: callflow-frontend
  labels:
    app: callflow-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: callflow-frontend
  template:
    metadata:
      labels:
        app: callflow-frontend
    spec:
      containers:
        - name: frontend
          image: callflow-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://callflow-backend-svc:8000/api/v1"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: callflow-frontend-svc
spec:
  selector:
    app: callflow-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
