version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: callflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-callflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-callflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callflow_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-callflow_user} -d ${POSTGRES_DB:-callflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - callflow-network

  redis:
    image: redis:7.2-alpine
    container_name: callflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-callflow_redis_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-callflow_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - callflow-network

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: callflow-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - callflow-network

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: callflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - callflow-network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: callflow-n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - callflow-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  n8n_data:

networks:
  callflow-network:
    driver: bridge
